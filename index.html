<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Notes Output</title>
</head>
<body style="font-family: sans-serif; margin: 0; padding: 10px;">
  <div id="content">Loading notes...</div>

  <script>
    // Replace with your actual Google Doc ID
    const docId = "1Rwxge4if3ufZ3L1I0gT3cCsjSBOupoUXGyMiDTjGzSY";
    const docUrl = `https://docs.google.com/document/d/${docId}/export?format=txt`;

    fetch(docUrl)
      .then(response => response.text())
      .then(text => {
        // Formats line breaks properly for the web page
        document.getElementById("content").innerText = text.trim();
      })
      .catch(err => {
        document.getElementById("content").innerText = "Error loading text";
      });
  </script>
</body>
</html>
