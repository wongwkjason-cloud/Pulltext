<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }

    .crop-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    iframe {
      position: absolute;
      /* Shifts the iframe up and left to strip out Google's document padding */
      top: -100px;       /* Increase if you still see blank space at the top */
      left: -100px;      /* Increase if you still see blank space on the left */
      
      /* Expands dimensions so the table content isn't squeezed */
      width: calc(100% + 120px);
      height: calc(100% + 120px);
      border: none;
    }
  </style>
</head>
<body>
  <div class="crop-wrapper">
    <iframe src="https://docs.google.com/document/d/e/2PACX-1vSlDXH1i9u9ZcTURfT0bocJZrd5HdTXkv1Be8dqfgTaf9QtsySovQIp9KNRdWkpOl1Vpnj1xSCBk97Q/pub?embedded=true"></iframe>
  </div>
</body>
</html>
