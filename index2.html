<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }

    .crop-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    iframe {
      position: absolute;
      /* Increased offsets to shift the inner document content to the top-left origin */
      top: -100px;
      left: -100px;
      
      /* Expand dimensions so content isn't cut off on the right or bottom */
      width: calc(100% + 200px);
      height: calc(100% + 200px);
      border: none;
    }
  </style>
</head>
<body>
  <div class="crop-wrapper">
    <iframe src="https://docs.google.com/document/d/e/2PACX-1vSlDXH1i9u9ZcTURfT0bocJZrd5HdTXkv1Be8dqfgTaf9QtsySovQIp9KNRdWkpOl1Vpnj1xSCBk97Q/pub?embedded=true"></iframe>
  </div>
</body>
</html>
